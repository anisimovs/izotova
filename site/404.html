<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Академия занимательных наук</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf{position:static; display:grid; place-items:center; min-height:100vh; padding:48px 24px; text-align:center}
  .nf-code{font-size:clamp(72px,14vw,150px); font-weight:900; line-height:1; letter-spacing:-.04em;
    background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .nf h1{margin:12px 0 14px; font-size:clamp(24px,5vw,38px); font-weight:900}
  .nf p{margin:0 auto 30px; max-width:42ch; color:var(--ink-soft); font-size:18px}
</style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf-code">404</div>
      <h1>Такой страницы нет</h1>
      <p>Похоже, ссылка устарела или в адресе опечатка. Все тетради — в каталоге.</p>
      <a class="btn btn-primary btn-lg" href="/">
        На главную
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
