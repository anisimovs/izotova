name: Deploy to Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Токен — в секретах репозитория (Settings → Secrets and variables → Actions).
# Он не попадает в лог: значение подставляется wrangler'у через env.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea632aaa7a5fda7c6205259a3fae906e
